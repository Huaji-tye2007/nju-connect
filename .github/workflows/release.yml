name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches VERSION
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' nju_connect.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version in nju_connect.py"
            exit 1
          fi
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # the source is nju_connect.py; users get it as the executable `nju-connect`
        run: |
          mkdir dist
          install -m 755 nju_connect.py dist/nju-connect
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/nju-connect install.sh config.toml.example
