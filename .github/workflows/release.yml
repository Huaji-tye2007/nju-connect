name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches VERSION
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' nju_connect/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version in nju_connect/__init__.py"
            exit 1
          fi
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # the nju_connect package is shipped as one executable zipapp, `nju-connect`
        run: |
          bash tools/build.sh
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/nju-connect install.sh config.toml.example
