name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q nju_connect
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build and smoke-test the executable
        run: |
          bash tools/build.sh
          python dist/nju-connect --version
          python dist/nju-connect config --help

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          bash -n install.sh tools/build.sh
          shellcheck install.sh tools/build.sh
